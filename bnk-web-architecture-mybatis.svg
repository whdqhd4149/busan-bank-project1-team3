<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BNK 1차 웹 프로젝트 시스템 아키텍처</title>
  <desc id="desc">사용자와 관리자의 요청이 Thymeleaf와 JavaScript, Controller, Service, MyBatis를 거쳐 Oracle로 이어지는 웹 구조</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .node{fill:#ffffff;stroke:#94a3b8;stroke-width:2}
      .primary{fill:#eef2ff;stroke:#6366f1}
      .data{fill:#fff7ed;stroke:#f97316}
      .label{font:600 22px "Noto Sans KR","Segoe UI",Arial,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}
      .sub{font:400 16px "Noto Sans KR","Segoe UI",Arial,sans-serif;fill:#475569;text-anchor:middle}
      .line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1200" height="720" rx="20"/>

  <rect class="node primary" x="430" y="35" width="340" height="70" rx="14"/>
  <text class="label" x="600" y="70">사용자 · 관리자</text>

  <path class="line" d="M600 105 V145"/>

  <rect class="node primary" x="410" y="147" width="380" height="80" rx="14"/>
  <text class="label" x="600" y="176">Thymeleaf · JavaScript</text>
  <text class="sub" x="600" y="206">화면 표시 및 사용자 요청</text>

  <path class="line" d="M600 227 V267"/>

  <rect class="node" x="455" y="269" width="290" height="66" rx="14"/>
  <text class="label" x="600" y="302">Controller</text>

  <path class="line" d="M600 335 V375"/>

  <rect class="node" x="455" y="377" width="290" height="66" rx="14"/>
  <text class="label" x="600" y="410">Service</text>

  <path class="line" d="M600 443 V483"/>

  <rect class="node data" x="370" y="485" width="460" height="78" rx="14"/>
  <text class="label" x="600" y="515">MyBatis</text>
  <text class="sub" x="600" y="545">데이터 조회 및 저장</text>

  <path class="line" d="M600 563 V603"/>

  <rect class="node data" x="490" y="605" width="220" height="56" rx="14"/>
  <text class="label" x="600" y="633">Oracle</text>

</svg>
